name: Deploy Next.js to VPS with PM2

on:
  push:
    branches: ["main"] # Lưu ý: sửa thành "production" nếu bạn push lên nhánh đó
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          # Các thông tin này lấy từ màn hình của bạn
          host: "0.tcp.ap.ngrok.io"
          username: "khang"
          port: 10644
          # Lấy khóa bí mật từ GitHub Secrets
          key: ${{ secrets.DEPLOY_KEY }}
          
          # Chỉ copy các file cần thiết để chạy Next.js (bỏ qua src, node_modules)
          source: ".next,public,package.json,package-lock.json,next.config.js,next.config.mjs"
          
          # THAY ĐỔI ĐƯỜNG DẪN NÀY: Thư mục chứa code trên VPS của bạn
          target: "/var/www/quanlycantin" 

      - name: Install & Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "0.tcp.ap.ngrok.io"
          username: "khang"
          port: 10644
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Di chuyển vào thư mục code (phải trùng với target ở trên)
            cd /var/www/quanlycantin
            
            # Cài đặt các package cần thiết cho môi trường production
            npm install --production
            
            # Khởi động lại PM2 nếu đã có, hoặc tạo mới nếu chưa có
            pm2 restart quanlycantin || pm2 start npm --name "quanlycantin" -- start
