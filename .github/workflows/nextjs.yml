name: Deploy Next.js to VPS with PM2

on:
  push:
    branches: ["production"] # Hoặc "main" tùy vào nhánh bạn đang dùng thực tế
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "0.tcp.ap.ngrok.io"
          username: "khang"
          port: 10644
          key: ${{ secrets.DEPLOY_KEY }}
          source: ".next,public,package.json,package-lock.json,next.config.js,next.config.mjs"
          target: "/var/www/quanlycantin" 

      - name: Install & Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "0.tcp.ap.ngrok.io"
          username: "khang"
          port: 10644
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/quanlycantin
            
            # Khai báo đầy đủ đường dẫn tới thư mục chứa lệnh node, npm và pm2 của user
            export PATH="/home/khang/.local/bin:/usr/local/bin:/usr/bin:/bin"
            
            # Cài đặt các package production
            npm install --production
            
            # Khởi động lại PM2
            pm2 restart quanlycantin || pm2 start npm --name "quanlycantin" -- start
